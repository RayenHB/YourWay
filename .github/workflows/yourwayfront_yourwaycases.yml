name: Build and deploy Node.js app to Azure Web App - YourWayCases

on:
  push:
    branches:
      - YourwayFront
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install and build
        # We tell GitHub to run these commands INSIDE your subfolder
        run: |
          npm install
          npm run build
        working-directory: my-app 

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # We only upload the 'dist' (or 'build') folder to keep it clean
          path: my-app/dist 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'YourWayCases'
          slot-name: 'Production'
          package: . # This stays '.' because the artifact is already just the built files
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0609FC2858BA476198E6527F072A2071 }}
